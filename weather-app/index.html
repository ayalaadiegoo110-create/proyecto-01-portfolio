<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp | Clima en Tiempo Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .btn-nav {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-nav:hover {
            background-color: #7dd3fc;
        }

        main {
            padding: 3rem 1rem;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .search-card {
            background: #1e293b;
            max-width: 450px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .search-box input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-box button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .weather-info {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #334155;
        }

        .weather-info h2 {
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .temp {
            font-size: 3rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }

        .desc {
            text-transform: capitalize;
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 1.5rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .error {
            color: #f87171;
            margin-top: 1rem;
            display: none;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌤️ WeatherApp</div>
        <a href="../" class="btn-nav">← Volver al Portafolio</a>
    </header>

    <main>
        <h1>Consulta el Clima en Vivo</h1>
        <p class="subtitle">Aplicación conectada a la API pública de OpenWeatherMap</p>

        <div class="search-card">
            <div class="search-box">
                <input type="text" id="city-input" placeholder="Ej: Asunción, Madrid, Tokyo...">
                <button id="search-btn">Buscar</button>
            </div>

            <p id="error-msg" class="error">Ciudad no encontrada. Intenta de nuevo.</p>

            <div id="weather-info" class="weather-info">
                <h2 id="city-name">--</h2>
                <div id="temp" class="temp">--°C</div>
                <div id="desc" class="desc">--</div>
                <div class="details">
                    <div>Humedad: <span id="humidity">--</span>%</div>
                    <div>Viento: <span id="wind">--</span> km/h</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 WeatherApp - Creado por Diego Ayala</p>
    </footer>

    <script>
        const apiKey = 'b1b15e88fa797225412429c1c50c122a11'; // Demo API key
        const searchBtn = document.getElementById('search-btn');
        const cityInput = document.getElementById('city-input');
        const weatherInfo = document.getElementById('weather-info');
        const errorMsg = document.getElementById('error-msg');

        async function getWeather(city) {
            try {
                errorMsg.style.display = 'none';
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=e38f1a2656360c6f14a0cb7974a4fa8f&units=metric&lang=es`);
                
                if (!response.ok) {
                    throw new Error('Ciudad no encontrada');
                }

                const data = await response.json();
                
                document.getElementById('city-name').textContent = `${data.name}, ${data.sys.country}`;
                document.getElementById('temp').textContent = `${Math.round(data.main.temp)}°C`;
                document.getElementById('desc').textContent = data.weather[0].description;
                document.getElementById('humidity').textContent = data.main.humidity;
                document.getElementById('wind').textContent = Math.round(data.wind.speed * 3.6);

                weatherInfo.style.display = 'block';
            } catch (error) {
                weatherInfo.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        searchBtn.addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) getWeather(city);
        });

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = cityInput.value.trim();
                if (city) getWeather(city);
            }
        });
    </script>
</body>
</html>
